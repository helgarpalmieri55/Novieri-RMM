# Throwaway stack for scripts/restore-drill.sh. NEVER run this by hand
# against the live project: the script pins the project name, unsets
# COMPOSE_* and refuses to run if the name matches the live stack's.
#
# Isolation, by construction: its own project name, network and volumes, no
# published ports, no bind mount of any live volume, and passwords generated
# per run (never the live ones). Images match docker-compose.yml's pins; a
# test holds them equal.
name: itms-restore-drill

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: itsuite
      POSTGRES_USER: its_admin
      POSTGRES_PASSWORD: ${DRILL_PG_PASSWORD:?generated by restore-drill.sh}
      APP_DB_PASSWORD: ${DRILL_APP_PASSWORD:?generated by restore-drill.sh}
      PORTAL_DB_PASSWORD: ${DRILL_PORTAL_PASSWORD:?generated by restore-drill.sh}
    volumes:
      - drill-postgres-data:/var/lib/postgresql/data
      - ../postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U its_admin -d itsuite"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    # No --import-realm: the realm must come from the restored database.
    command: start --hostname-strict=false --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: its_admin
      KC_DB_PASSWORD: ${DRILL_PG_PASSWORD:?generated by restore-drill.sh}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  drill-postgres-data:
