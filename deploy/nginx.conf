server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CACHING IS NOT AN OPTIMISATION HERE, IT IS A CORRECTNESS PROBLEM.
    #
    # Vite emits content-hashed bundles (`assets/index-<hash>.js`) referenced by
    # name from index.html. Get the caching backwards and a browser holds a
    # stale index.html that names a bundle from the PREVIOUS deploy, and keeps
    # running it -- so an operator sees old code after an upgrade, with no error
    # anywhere and no way to tell from the server side. This was observed on the
    # first real deploy: a fix shipped, the console was verified working, and a
    # later plain navigation silently loaded the pre-fix bundle again and
    # reproduced a defect that no longer existed in the deployment.
    #
    # The two rules below are opposites on purpose.

    # 1. Hashed assets are immutable. The hash IS the version, so a changed file
    #    is a different URL and this can never serve stale content. A year is
    #    the conventional maximum and `immutable` tells the browser not even to
    #    revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 2. Everything else -- above all index.html, including every SPA fallback
    #    below -- must be revalidated on each load. index.html is the ONE file
    #    whose URL does not change between deploys, so it is the one file a
    #    cache must never keep. `no-store` rather than `no-cache` because a
    #    conditional revalidation still leaves a window where a proxy answers
    #    from its own copy.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        # SPA fallback: unknown paths are client-side routes, not 404s.
        try_files $uri $uri/ /index.html;
    }
}
