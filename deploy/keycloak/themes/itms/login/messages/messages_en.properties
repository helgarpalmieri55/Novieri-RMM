# ITMS additions to Keycloak's own message bundle.
#
# WHY THIS FILE EXISTS, and it is a correction rather than a feature. The
# templates first wrote `${msg("itmsAccessNotice", "Authorized access only.")}`
# on the assumption that the second argument is a fallback. It is not: `msg`
# takes SUBSTITUTION PARAMETERS, and an unknown key renders as the key itself.
# So the operator's login page displayed the literal string
# "itmsAccessNotice" where a sentence belonged.
#
# Keys the product invents live here. Defining one that Keycloak also defines
# is harmless -- a theme bundle overrides the parent -- so anything this theme
# is not certain of is listed rather than assumed.
#
# `messages_en.properties` and no other locale: this is the only language the
# product ships copy in today. Keycloak falls back to English for a locale it
# has no file for, which is the honest behaviour until there is a translation
# to offer instead of a guess.

itmsAccessNotice=Authorized access only. Activity is monitored and audited.
loginOtpHelp=6 digits, from your authenticator app.
itmsPasswordAccepted=Password accepted
loginTotpStepNote=Enter the code your authenticator app shows to finish signing in.
updatePasswordMessage=Choose a new password. This platform never sees it.
or=or

# Passkeys: webauthn-register.ftl and webauthn-error.ftl. The trouble note is
# written for the failure people actually hit -- Windows offering to save the
# passkey to Microsoft Password Manager and then failing to reach it -- and
# names the escape hatch by the label Windows puts on it.
itmsPasskeyIntro=Your passkey replaces a password. You confirm it with your fingerprint, face or device PIN.
itmsPasskeyStep1=Select Create passkey. Your browser asks where to save it.
itmsPasskeyStep2=Confirm with your fingerprint, face or device PIN.
itmsPasskeyCreate=Create passkey
itmsPasskeyTroubleTitle=If your password manager can''t be reached
itmsPasskeyTroubleBody=Choose Save another way, then this device or your phone. The passkey works the same wherever it is saved.
itmsPasskeyErrorIntro=Your browser or device couldn''t finish this step. Try again.

# APOSTROPHES ARE WRITTEN TWICE, AND THAT IS NOT A TYPO. Keycloak renders every
# message through Java's MessageFormat, where a single ' opens a quoted literal
# and is swallowed: "can't" reached the screen as "cant" on 2026-09-22, found
# only by rendering the page in a real Keycloak. '' renders as one apostrophe.
# Keycloak's own bundle writes "Don''t" for the same reason.

# Overrides of Keycloak's own TOTP keys.
# The stock step reads "Install one of the following applications on your
# mobile:" -- and the stock template lists them beneath it. This theme's
# login-config-totp.ftl does not, so the sentence pointed at nothing.
loginTotpStep1=Install an authenticator app on your phone, such as Microsoft Authenticator or Google Authenticator.
# Sentence case, like every other label in the product ("One-time code").
loginTotpDeviceName=Device name

# The consent screen's line for the `mcp` scope (init-clients.py,
# MCP_SCOPE_ATTRIBUTES: consent.screen.text = ${itmsMcpConsent}). The stock
# login-oauth-grant.ftl renders it through advancedMsg. It says what approving
# hands over, because the consent screen is the only check between a sign-in
# link someone was sent and that person's whole authority.
itmsMcpConsent=Act as you in ITMS: everything your role allows, including running actions on managed computers
