# Añadidos de ITMS al paquete de mensajes de Keycloak, en español.
#
# POR QUÉ EXISTE ESTE ARCHIVO, y es una corrección más que una función. Las
# plantillas escribieron primero `${msg("itmsAccessNotice", "Authorized access only.")}`
# suponiendo que el segundo argumento es un valor por defecto. No lo es: `msg`
# recibe PARÁMETROS DE SUSTITUCIÓN, y una clave desconocida se muestra como la
# propia clave. Así que la página de inicio de sesión del operador mostraba la
# cadena literal "itmsAccessNotice" donde debía ir una frase.
#
# Las claves que inventa el producto viven aquí. Definir una que Keycloak
# también define es inofensivo -- el paquete del tema anula al del tema padre --
# así que todo aquello de lo que este tema no está seguro se lista en lugar de
# darse por supuesto.
#
# `messages_es.properties` lleva las mismas claves que `messages_en.properties`,
# ni una más ni una menos: Keycloak recurre al inglés para una clave que un
# idioma no tiene, y eso sería una frase en inglés en mitad de una página en
# español. Todo lo demás en español (etiquetas de campos, errores, correos) lo
# aporta el tema base de Keycloak.
#
# CODIFICACIÓN: UTF-8, sin marca BOM, con los caracteres escritos tal cual y no
# como secuencias de escape. Keycloak 26 lee estos archivos como UTF-8 (y solo recurre
# a ISO-8859-1 si los bytes no son UTF-8 válido).

itmsAccessNotice=Acceso solo para personas autorizadas. La actividad se supervisa y se audita.
loginOtpHelp=6 dígitos, de tu aplicación de autenticación.
itmsPasswordAccepted=Contraseña aceptada
loginTotpStepNote=Introduce el código que muestra tu aplicación de autenticación para terminar de iniciar sesión.
updatePasswordMessage=Elige una contraseña nueva. Esta plataforma nunca la ve.
or=o

# Claves de acceso: webauthn-register.ftl y webauthn-error.ftl. La nota de
# problemas está escrita para el fallo con el que se encuentra la gente --
# Windows ofrece guardar la clave de acceso en el Administrador de contraseñas
# de Microsoft y luego no logra conectar con él -- y nombra la salida de
# emergencia con la etiqueta que le pone Windows.
itmsPasskeyIntro=Tu clave de acceso sustituye a una contraseña. La confirmas con tu huella, tu rostro o el PIN de tu dispositivo.
itmsPasskeyStep1=Selecciona Crear clave de acceso. Tu navegador te preguntará dónde guardarla.
itmsPasskeyStep2=Confirma con tu huella, tu rostro o el PIN de tu dispositivo.
itmsPasskeyCreate=Crear clave de acceso
itmsPasskeyTroubleTitle=Si no se puede acceder a tu administrador de contraseñas
itmsPasskeyTroubleBody=Elige la opción de guardarla de otra forma y luego este dispositivo o tu teléfono. La clave de acceso funciona igual dondequiera que se guarde.
itmsPasskeyErrorIntro=Tu navegador o dispositivo no pudo completar este paso. Vuelve a intentarlo.

# LOS APÓSTROFOS SE ESCRIBEN DOS VECES, Y NO ES UNA ERRATA. Keycloak procesa
# cada mensaje con el MessageFormat de Java, donde un ' suelto abre un literal
# entrecomillado y desaparece: "can't" llegó a la pantalla como "cant" el
# 2026-09-22. '' se muestra como un solo apóstrofo. Este archivo no necesita
# ninguno, pero la regla es del archivo y no del idioma.

# Anulaciones de las claves de TOTP de Keycloak.
# El paso original dice "Instala una de las siguientes aplicaciones en tu
# teléfono móvil:" -- y la plantilla original las lista debajo. El
# login-config-totp.ftl de este tema no lo hace, así que la frase apuntaba a nada.
loginTotpStep1=Instala una aplicación de autenticación en tu teléfono, como Microsoft Authenticator o Google Authenticator.
# Mayúscula solo en la primera palabra, como el resto de etiquetas del producto
# ("Código de un solo uso").
loginTotpDeviceName=Nombre del dispositivo

# La línea de la pantalla de consentimiento para el ámbito `mcp` (init-clients.py,
# MCP_SCOPE_ATTRIBUTES: consent.screen.text = ${itmsMcpConsent}). La plantilla
# original login-oauth-grant.ftl la muestra con advancedMsg. Dice lo que se
# entrega al aprobar, porque la pantalla de consentimiento es lo único que hay
# entre un enlace de inicio de sesión que alguien recibió y toda la autoridad de
# esa persona.
itmsMcpConsent=Actuar como tú en ITMS: todo lo que permite tu rol, incluido ejecutar acciones en equipos gestionados
