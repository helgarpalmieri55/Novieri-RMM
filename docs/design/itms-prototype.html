<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Toeshee RMS — Interactive Platform Prototype</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #111116;
      --ink-2: #24232b;
      --muted: #5f6470;
      --muted-2: #686d7a;
      --canvas: #f4f5f8;
      --surface: #ffffff;
      --surface-2: #fafbfc;
      --sidebar: #0d2026;
      --sidebar-2: #122c33;
      --rail-label: #93a8ae;
      --rail-eyebrow: #8a9ba1;
      --rail-glow: #6aa6ff;
      --line: #e7e9f0;
      --line-strong: #d6d9e2;
      /* The boundary that says "this is a control". WCAG 2.2 SC 1.4.11 wants 3:1;
         this measures 3.56:1 on --surface, 3.43:1 on --surface-2 and 3.26:1 on
         --canvas. --line and --line-strong stay decorative and stay where they are. */
      --line-control: #828895;
      --primary: #1e5fd0;
      --primary-2: #2f7bf0;
      --primary-soft: #e8f0ff;
      --primary-ink: #174cab;
      --action: #c2186f;
      --action-2: #e0348a;
      --action-soft: #fdeaf4;
      --action-ink: #9c1259;
      --violet: #6d3fc4;
      --violet-soft: #f1ebfd;
      --violet-ink: #5730a3;
      --gold: #b06a00;
      --gold-2: #d98c14;
      --gold-soft: #fdf2e0;
      --gold-ink: #8a5300;
      --orange: #a8551f;
      --orange-soft: #fdefe8;
      --orange-ink: #8a4318;
      --green: #1a7f4b;
      --green-soft: #e6f7ee;
      --green-ink: #13653b;
      --red: #c62b3d;
      --red-soft: #fdecee;
      --red-ink: #a81f30;
      --blue: #0d6f85;
      --blue-soft: #e2f4f8;
      --blue-ink: #0a5c6e;
      --shadow: 0 12px 32px rgba(13, 32, 38, .07);
      --shadow-soft: 0 5px 18px rgba(13, 32, 38, .05);
      --radius-code: 8px;
  --radius-field: 9px;
  --radius-control: 10px;
  --radius-card-inner: 12px;
  --radius-tile: 14px;
  --radius: 16px;
      --sidebar-w: 258px;
      --topbar-h: 72px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 1120px;
      background: var(--canvas);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      overflow-x: auto;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    .shell { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-w);
      z-index: 40;
      display: flex;
      flex-direction: column;
      color: #f8f8fb;
      background:
        radial-gradient(circle at 40px -20px, rgba(106, 166, 255, .16), transparent 240px),
        linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%);
      border-right: 1px solid rgba(255,255,255,.06);
      transition: width .22s ease;
    }
    .brand {
      height: var(--topbar-h);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      flex: 0 0 auto;
    }
    .brand-mark {
      width: 31px;
      height: 31px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: conic-gradient(from 210deg, var(--primary-ink), var(--rail-glow), var(--action), var(--primary-ink));
      box-shadow: 0 0 0 1px rgba(255,255,255,.13), 0 9px 25px rgba(30, 95, 208, .28);
    }
    .brand-mark::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 4px solid var(--sidebar);
      border-left-color: transparent;
      transform: rotate(45deg);
      border-radius: 4px;
    }
    .brand-copy { min-width: 0; }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
    .brand-sub { color: #a8a5b0; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-top: 1px; }
    .collapse-btn {
      margin-left: auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #bebbc8;
      background: transparent;
      border: 1px solid transparent;
    }
    .collapse-btn:hover { color: #fff; background: rgba(255,255,255,.07); }

    .nav-scroll {
      padding: 14px 10px 24px;
      overflow-y: auto;
      flex: 1 1 auto;
      scrollbar-width: thin;
      scrollbar-color: #34313d transparent;
    }
    .nav-group { margin-bottom: 17px; }
    .nav-label {
      margin: 0 10px 7px;
      color: #777380;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .nav-item {
      width: 100%;
      height: 39px;
      padding: 0 10px;
      margin: 2px 0;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 10px;
      color: #bcb9c5;
      background: transparent;
      text-align: left;
      transition: color .14s, background .14s, transform .14s;
      white-space: nowrap;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.055); transform: translateX(1px); }
    .nav-item.active {
      color: #fff;
      background: linear-gradient(90deg, rgba(30, 95, 208, .34), rgba(30, 95, 208, .16));
      box-shadow: inset 3px 0 0 var(--rail-glow), 0 8px 22px rgba(6, 20, 24, .18);
    }
    .nav-item .nav-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .nav-item .nav-text { overflow: hidden; text-overflow: ellipsis; }
    .nav-badge {
      margin-left: auto;
      min-width: 20px;
      height: 19px;
      padding: 0 6px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--primary-soft);
      background: rgba(30, 95, 208, .42);
      font-size: 10px;
      font-weight: 800;
    }
    .nav-badge.gold { color: #ffe8a3; background: rgba(209,154,24,.32); }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,.07);
      flex: 0 0 auto;
    }
    .tenant-card {
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.055);
    }
    .tenant-avatar {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-ink), var(--action));
      border: 1px solid rgba(255,255,255,.1);
    }
    .tenant-meta { min-width: 0; }
    .tenant-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tenant-plan { font-size: 10px; color: var(--rail-glow); margin-top: 2px; }

    .app-shell { margin-left: var(--sidebar-w); min-height: 100vh; transition: margin-left .22s ease; }
    .topbar {
      height: var(--topbar-h);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 26px;
      background: rgba(255,255,255,.93);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    .page-context { min-width: 220px; }
    .crumbs { display: flex; gap: 6px; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .crumbs strong { color: var(--primary); font-weight: 700; }
    .top-page-title { font-size: 17px; font-weight: 800; letter-spacing: -.025em; }
    .topbar-search {
      flex: 1 1 520px;
      max-width: 620px;
      height: 39px;
      margin-left: auto;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      /* WAS #777581 -- 4.26:1 on this rule's own #f8f8fa ground, measured from
       * the rendered console at 1440px, against WCAG 1.4.3's 4.5:1. This is
       * the placeholder of the global search field, the one control in the
       * top bar carrying words. --muted measures 5.59:1 here. */
      color: var(--muted);
      background: #f8f8fa;
      border: 1px solid var(--line-control);
      border-radius: 11px;
      box-shadow: inset 0 1px 0 #fff;
    }
    .topbar-search:hover { border-color: var(--muted); background: #fff; }
    .topbar-search span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kbd {
      min-width: 34px;
      padding: 2px 6px;
      border-radius: 6px;
      /* WAS #8b8994 -- 3.44:1 on the #fff beneath it. The `/` and `Esc` hints
       * are how a keyboard user learns the shortcut exists. --muted: 5.93:1. */
      color: var(--muted);
      background: #fff;
      border: 1px solid #e4e2e8;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
    }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .top-icon-btn, .profile-btn, .tenant-switcher {
      height: 39px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line-control);
      background: #fff;
      color: var(--ink-2);
      border-radius: 11px;
      box-shadow: 0 2px 5px rgba(20,17,32,.02);
    }
    .top-icon-btn { width: 39px; justify-content: center; position: relative; }
    .top-icon-btn:hover, .profile-btn:hover, .tenant-switcher:hover { background: var(--primary-soft); border-color: var(--muted); }
    .counter-dot {
      position: absolute;
      top: -4px; right: -3px;
      min-width: 17px; height: 17px; padding: 0 4px;
      display: grid; place-items: center;
      color: #fff; background: var(--primary); border-radius: 999px;
      font-size: 9px; font-weight: 800; border: 2px solid #fff;
    }
    .tenant-switcher { min-width: 190px; padding: 0 11px; gap: 8px; }
    .tenant-switcher .tenant-current { flex: 1; text-align: left; font-weight: 700; font-size: 12px; }
    .profile-btn { padding: 0 9px 0 5px; gap: 8px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      color: #fff; font-size: 11px; font-weight: 800;
      background: linear-gradient(135deg, var(--sidebar), var(--primary));
    }
    .profile-copy { text-align: left; }
    .profile-name { display: block; font-size: 11px; font-weight: 800; line-height: 1.15; }
    .profile-role { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; }

    .main { padding: 24px 26px 42px; }
    .page-head {
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }
    .page-head h1 { margin: 0; font-size: 27px; letter-spacing: -.045em; line-height: 1.08; }
    .page-head p { max-width: 780px; margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .eyebrow { color: var(--primary); font-size: 10px; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 6px; }
    .head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; flex: 0 1 auto; }

    .btn {
      min-height: 37px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 10px;
      border: 1px solid var(--line-control);
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 2px 5px rgba(22,17,33,.025);
      transition: transform .12s, box-shadow .12s, border-color .12s;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--muted); box-shadow: 0 7px 14px rgba(22,17,33,.055); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn.primary { color: #fff; background: linear-gradient(135deg, var(--action), var(--action-ink)); border-color: var(--action-ink); box-shadow: 0 8px 18px rgba(194, 24, 111, .18); }
    .btn.gold { color: #241b08; background: linear-gradient(135deg, #f4c454, #d99f1d); border-color: var(--gold); }
    .btn.ghost { background: transparent; box-shadow: none; }
    .btn.danger { color: #c12d42; border-color: var(--red); background: #fff8f9; }
    .btn.small { min-height: 31px; padding: 0 10px; font-size: 11px; border-radius: 8px; }
    .btn.icon-only { width: 37px; padding: 0; }
    /* A DISABLED BUTTON MUST NOT BE PIXEL-IDENTICAL TO AN ENABLED ONE. There was
       no rule at all: same fill, same border, same text colour, and `cursor:
       pointer` actively saying the opposite of the truth. It shows up worst in
       the type-to-confirm dialog, whose entire design is "you cannot press this
       until you type the hostname". Last in the .btn block on purpose -- equal
       specificity to .btn.primary/.gold/.danger and to .btn:hover, so source
       order is what flattens the gradients and cancels the hover lift.
       SC 1.4.11 exempts inactive components from the 3:1 boundary floor
       explicitly, so this is about being legible AS disabled, not about hitting
       a ratio: --line-strong keeps the control findable at 1.41:1 where
       --line-control drew it at 3.56:1, and the label drops from --ink (18.2:1)
       to --muted-2 (5.0:1). */
    .btn:disabled { cursor: not-allowed; transform: none; color: var(--muted-2); background: var(--surface-2); border-color: var(--line-strong); box-shadow: none; }

    .stats-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    /* The column count is an attribute so the responsive steps can outrank it.
       As an inline style it beat every media query and tile rows never folded.
       These are (0,2,0) and the steps below are `.stats-grid[data-columns]`,
       also (0,2,0), so source order decides and the later step wins. */
    .stats-grid[data-columns="1"] { grid-template-columns: minmax(0, 1fr); }
    .stats-grid[data-columns="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats-grid[data-columns="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stats-grid[data-columns="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stats-grid[data-columns="5"] { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .stats-grid[data-columns="6"] { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .stat-card {
      min-height: 112px;
      padding: 15px;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
    }
    .stat-card::after {
      content: "";
      position: absolute;
      width: 90px; height: 90px; border-radius: 999px;
      right: -42px; top: -48px;
      background: var(--primary-soft);
      opacity: .65;
    }
    .stat-card.gold-accent::after { background: var(--gold-soft); }
    .stat-top { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .stat-icon {
      width: 32px; height: 32px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 10px;
    }
    .stat-card.gold-accent .stat-icon { color: var(--gold); background: var(--gold-soft); }
    .stat-value { margin-top: 9px; font-size: 25px; font-weight: 850; letter-spacing: -.045em; line-height: 1; }
    .stat-foot { margin-top: 8px; display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 10px; }
    .trend-up { color: var(--green); font-weight: 800; }
    .trend-down { color: var(--red); font-weight: 800; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: minmax(0, 1.55fr) minmax(340px, .8fr); }
    .grid-equal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .panel.pad { padding: 17px; }
    .panel-head {
      min-height: 54px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { font-size: 15px; font-weight: 850; letter-spacing: -.02em; }
    .panel-subtitle { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .panel-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .panel-link { color: var(--primary); font-size: 11px; font-weight: 800; cursor: pointer; }
    .panel-link:hover { text-decoration: underline; }
    .panel-body { padding: 16px; }

    .chart-wrap { position: relative; min-height: 245px; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 10px; color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 999px; }
    .svg-chart { width: 100%; height: 200px; overflow: visible; }
    .axis-label { fill: #9a98a3; font-size: 9px; }
    .chart-gridline { stroke: #ecebf0; stroke-width: 1; }

    .donut-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .donut-card { text-align: center; padding: 10px 6px; }
    .donut {
      --pct: 75;
      width: 82px; height: 82px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: conic-gradient(var(--primary) calc(var(--pct) * 1%), var(--line) 0);
      position: relative;
    }
    .donut::after { content: ""; width: 58px; height: 58px; border-radius: 50%; background: #fff; position: absolute; }
    .donut strong { position: relative; z-index: 1; font-size: 17px; letter-spacing: -.04em; }
    .donut-label { font-size: 11px; font-weight: 800; }
    .donut-sub { color: var(--muted); font-size: 9px; margin-top: 3px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 10px 12px;
      text-align: left;
      color: #878590;
      background: #fbfafc;
      border-bottom: 1px solid var(--line);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 11px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover { background: var(--primary-soft); }
    .cell-main { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .device-glyph, .row-glyph {
      width: 30px; height: 30px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 9px;
    }
    .row-glyph.gold { color: var(--gold); background: var(--gold-soft); }
    .cell-title { font-weight: 780; color: var(--ink-2); }
    .cell-sub { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 23px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 850;
      white-space: nowrap;
    }
    .status.success, .status.healthy, .status.online, .status.completed, .status.low { color: var(--green); background: var(--green-soft); }
    .status.warning, .status.pending, .status.medium, .status.due, .status.expiring { color: var(--orange); background: var(--orange-soft); }
    .status.critical, .status.failed, .status.high, .status.overdue, .status.offline, .status.expired, .status.revoked { color: var(--red); background: var(--red-soft); }
    .status.info, .status.running, .status.open, .status.scheduled, .status.renewing { color: var(--blue); background: var(--blue-soft); }
    .status.purple, .status.approved { color: var(--primary-ink); background: var(--primary-soft); }
    .status.gold { color: #9b6d00; background: var(--gold-soft); }
    .status.neutral { color: #6f6c77; background: #f0eff3; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: currentColor; }

    .progress { height: 7px; background: #eceaf0; border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }
    .progress.gold > span { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
    .progress.green > span { background: linear-gradient(90deg, #148a55, #39b97a); }
    .progress.red > span { background: linear-gradient(90deg, #c93449, #eb6475); }

    .filterbar {
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid var(--line);
      background: #fcfbfd;
    }
    .search-field, .select-field, .input-field {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line-control);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    .search-field { min-width: 230px; flex: 1; }
    .search-field:focus, .select-field:focus, .input-field:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 95, 208, .1); }
    .filter-spacer { flex: 1; }
    .segmented {

    .mini-list { display: flex; flex-direction: column; }
    .mini-row {

    }
    .mini-row:last-child { border-bottom: 0; }
    .mini-icon {
      width: 27px; height: 27px; flex: 0 0 auto;

    .mini-icon.gold { color: var(--gold); background: var(--gold-soft); }
    .mini-icon.red { color: var(--red); background: var(--red-soft); }
    .mini-icon.green { color: var(--green); background: var(--green-soft); }

    .metric-inline { font-size: 18px; font-weight: 850; letter-spacing: -.04em; }

    .notice {

      gap: 10px;
      align-items: flex-start;

    .notice.gold { color: var(--gold-ink); background: var(--gold-soft); border-color: var(--line); }
    .notice.red { color: var(--red-ink); background: var(--red-soft); border-color: var(--line); }

    .detail-split { display: grid; grid-template-columns: 260px minmax(0,1fr); min-height: 560px; }
    .detail-nav { padding: 14px; border-right: 1px solid var(--line); background: #fbfafc; }
    .detail-nav button { width: 100%; padding: 10px; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 750; text-align: left; }
    .detail-nav button.active { color: var(--primary-ink); background: var(--primary-soft); }
    .detail-content { padding: 18px; }

    .kanban { display: grid; grid-template-columns: repeat(4, minmax(230px,1fr)); gap: 12px; overflow-x: auto; }
    .kanban-col { padding: 10px; background: #f0eff3; border-radius: 14px; min-height: 450px; }
    .kanban-head { padding: 4px 5px 10px; display: flex; align-items: center; justify-content: space-between; color: #595763; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
    .ticket-card { padding: 12px; margin-bottom: 9px; background: #fff; border: 1px solid #e2e0e6; border-radius: 11px; box-shadow: 0 4px 12px rgba(26,21,38,.04); cursor: pointer; }
    .ticket-card:hover { border-color: var(--line-control); }
    .ticket-id { color: var(--primary); font-size: 9px; font-weight: 900; }
    .ticket-title { margin-top: 5px; font-size: 11px; font-weight: 800; }
    .ticket-meta { margin-top: 9px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 9px; }

    .timeline { position: relative; padding-left: 22px; }
    .timeline::before { content: ""; position: absolute; left: 7px; top: 7px; bottom: 7px; width: 1px; background: var(--line-strong); }
    .timeline-item { position: relative; padding: 0 0 16px 8px; }
    .timeline-item::before { content: ""; position: absolute; left: -19px; top: 4px; width: 9px; height: 9px; border: 2px solid #fff; background: var(--primary); border-radius: 999px; box-shadow: 0 0 0 1px var(--primary-soft); }
    .timeline-time { color: var(--muted); font-size: 9px; }
    .timeline-title { font-size: 11px; font-weight: 800; margin-top: 2px; }
    .timeline-copy { color: var(--muted); font-size: 9px; margin-top: 2px; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .calendar-day { min-height: 100px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
    .calendar-day:nth-child(7n) { border-right: 0; }
    .calendar-day:nth-last-child(-n+7) { border-bottom: 0; }
    .calendar-num { color: var(--muted); font-size: 9px; font-weight: 800; }
    .calendar-event { margin-top: 7px; padding: 5px 6px; border-radius: 7px; color: var(--primary-ink); background: var(--primary-soft); font-size: 8px; font-weight: 800; }
    .calendar-event.gold { color: #8b6500; background: var(--gold-soft); }

    .portal-preview {
      min-height: 590px;
      display: grid;
      grid-template-columns: 200px 1fr;
      border: 8px solid #17161c;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .portal-side { padding: 20px 14px; color: #fff; background: #111015; }
    .portal-main { padding: 24px; background: #f7f7f9; }
    .portal-hero { padding: 26px; border-radius: 17px; color: #fff; background: linear-gradient(135deg, var(--sidebar), var(--primary) 74%, var(--gold-2)); }
    .portal-search { height: 44px; margin-top: 18px; padding: 0 14px; display: flex; align-items: center; gap: 9px; color: #777; background: #fff; border-radius: 11px; }

    .ai-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) 350px; gap: 14px; }
    .chat-panel { min-height: 650px; display: flex; flex-direction: column; }
    .chat-scroll { flex: 1; padding: 18px; overflow-y: auto; background: linear-gradient(180deg, var(--surface), var(--surface-2)); }
    .msg { max-width: 76%; margin: 0 0 14px; padding: 12px 13px; border-radius: 14px; font-size: 11px; }
    .msg.assistant { border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow-soft); }
    .msg.user { margin-left: auto; color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-ink)); }
    .msg-label { margin-bottom: 5px; color: var(--muted); font-size: 9px; font-weight: 850; }
    .msg.user .msg-label { color: rgba(255,255,255,.7); }
    .chat-compose { padding: 13px; display: flex; gap: 9px; border-top: 1px solid var(--line); background: #fff; }
    .chat-input { flex: 1; min-height: 42px; max-height: 90px; padding: 10px 12px; resize: vertical; border: 1px solid var(--line-control); border-radius: 10px; outline: none; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .suggestion { padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #fff; font-size: 9px; font-weight: 700; cursor: pointer; }
    .suggestion:hover { color: var(--primary); border-color: var(--primary); }

    .autonomy-row { padding: 13px 0; border-bottom: 1px solid var(--line); }
    .autonomy-row:last-child { border-bottom: 0; }
    /* THE CHECKED STATE, WHICH WAS THE OPERATOR'S OPERATING SYSTEM'S TO PICK.
       `.range` below has tinted its native control from a token since this
       design was drawn; checkboxes and radios never did, so their fill was
       `AccentColor` -- whatever accent the person's desktop is set to, which
       may be any hue at any lightness. On a console where a checkbox decides
       which devices a bulk action reaches, the mark saying "this one is in
       the blast radius" is not the OS's decision to make. `--primary`
       measures 5.83:1 on `--surface`, 5.63:1 on `--surface-2` and 5.35:1 on
       `--canvas`.

       IT IS `accent-color` AND NOT A DRAWN CONTROL, deliberately. `border`
       and `background` are the properties that would harden the UNCHECKED
       edge, and authoring either one on a native checkbox switches Blink and
       WebKit out of native appearance entirely -- taking the checkmark with
       it. The unchecked boundary therefore stays as the user agent draws it,
       which is where WCAG 2.2 SC 1.4.11 leaves it: the criterion excepts
       "where the appearance of the component is determined by the user agent
       and not modified by the author". */
    input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }
    .range { width: 100%; accent-color: var(--primary); }
    .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 8px; }

    .map-board {
      min-height: 360px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background:
        linear-gradient(rgba(30, 95, 208, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 95, 208, .06) 1px, transparent 1px),
        #faf9fc;
      background-size: 24px 24px;
      border: 1px solid var(--line);
    }
    .map-node { position: absolute; padding: 10px 12px; min-width: 120px; background: #fff; border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: var(--shadow-soft); }
    .map-node::after { content: ""; position: absolute; width: 42px; height: 1px; background: var(--line-strong); top: 50%; left: 100%; }
    .map-node.last::after { display: none; }

    .dropdown {
      position: fixed;
      z-index: 80;
      min-width: 220px;
      padding: 7px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(25,20,38,.18);
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button {
      width: 100%; min-height: 36px; padding: 0 10px;
      display: flex; align-items: center; gap: 9px;
      border: 0; border-radius: 8px; background: transparent; text-align: left; font-size: 11px;
    }
    .dropdown button:hover { background: var(--primary-soft); color: var(--primary-ink); }
    .dropdown .divider { height: 1px; margin: 5px 0; background: var(--line); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(10,9,13,.38);
      backdrop-filter: blur(3px);
    }
    .overlay.open { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      z-index: 90;
      width: min(620px, 92vw);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: 1px solid var(--line);
      box-shadow: -20px 0 60px rgba(21,17,31,.18);
      transform: translateX(102%);
      transition: transform .22s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head, .modal-head { min-height: 66px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .drawer-title, .modal-title { font-size: 15px; font-weight: 850; letter-spacing: -.025em; }
    .drawer-body { padding: 18px; overflow-y: auto; flex: 1; }
    .drawer-foot, .modal-foot { padding: 13px 18px; display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); background: #fbfafc; }
    .close-btn { margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-control); background: #fff; border-radius: 9px; }

    .modal {
      position: fixed;
      inset: 50% auto auto 50%;
      z-index: 95;
      width: min(650px, 90vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 28px 90px rgba(22,17,32,.24);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -47%) scale(.98);
      transition: opacity .15s, transform .15s;
    }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .modal-body { padding: 18px; overflow-y: auto; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    /* 12px, NOT the 10px this rule carried. DESIGN.md's Twelve Pixel Floor is
       a product requirement -- nothing renders below 12px -- and the console's
       `contrast.test.ts` enforces it on every shell stylesheet. The design file
       is not in that sweep, so this rule sat under the floor unseen until the
       port that was always going to carry it across. */
    .field label, .field > span { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--line-control); border-radius: 9px; outline: none; background: #fff; }
    .field textarea { min-height: 90px; resize: vertical; }
    .field .help { color: var(--muted); font-size: 12px; }

    .palette {
      position: fixed;
      top: 88px; left: 50%;
      z-index: 100;
      width: min(700px, 88vw);
      max-height: 72vh;
      display: none;
      overflow: hidden;
      transform: translateX(-50%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(18,15,27,.28);
    }
    .palette.open { display: block; }
    .palette-search { height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .palette-search input { flex: 1; border: 0; outline: none; font-size: 14px; }
    .palette-results { max-height: 58vh; overflow-y: auto; padding: 8px; }
    .palette-item { width: 100%; min-height: 48px; padding: 0 10px; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
    .palette-item:hover, .palette-item.active { background: var(--primary-soft); color: var(--primary); }
    .palette-item .meta { margin-left: auto; color: var(--muted); font-size: 9px; }

    .toast-stack { position: fixed; z-index: 110; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 9px; }
    .toast { min-width: 310px; max-width: 430px; padding: 12px 13px; display: flex; gap: 10px; align-items: flex-start; color: #fff; background: #17151d; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; box-shadow: 0 14px 40px rgba(15,12,22,.24); animation: toastIn .22s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }
    .toast-icon { width: 24px; height: 24px; display: grid; place-items: center; flex: 0 0 auto; color: #e1c36d; background: rgba(209,154,24,.18); border-radius: 7px; }
    .toast-title { font-size: 11px; font-weight: 850; }
    .toast-copy { margin-top: 2px; color: #bbb7c5; font-size: 9px; }

    .empty { min-height: 260px; display: grid; place-items: center; text-align: center; padding: 30px; }
    .empty-icon { width: 50px; height: 50px; margin: 0 auto 12px; display: grid; place-items: center; color: var(--primary); background: var(--primary-soft); border-radius: 15px; }
    .empty h3 { margin: 0; font-size: 14px; }
    .empty p { max-width: 370px; margin: 7px auto 14px; color: var(--muted); font-size: 10px; }

    .code {
      padding: 12px;
      border-radius: 10px;
      color: #e6e3eb;
      background: #15141a;
      font: 10px/1.7 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-x: auto;
    }
    /* An inline box does not grow for its own vertical padding (CSS 2.1
       §10.6.1), so a 12px-padded `<code>` in a sentence paints over the lines
       above and below it. Scoped to `code.code`: every `<pre class="code">` is
       a full-width block and must stay one. */
    code.code {
      display: inline-block;
      max-width: 100%;
    }

    body.sidebar-collapsed { --sidebar-w: 76px; }
    body.sidebar-collapsed .brand-copy,
    body.sidebar-collapsed .nav-label,
    body.sidebar-collapsed .nav-text,
    body.sidebar-collapsed .nav-badge,
    body.sidebar-collapsed .tenant-meta { display: none; }
    body.sidebar-collapsed .brand { padding: 0 15px; }
    body.sidebar-collapsed .collapse-btn { position: absolute; left: 61px; top: 21px; z-index: 2; color: var(--ink); background: #fff; border-color: var(--line); box-shadow: var(--shadow-soft); }
    body.sidebar-collapsed .nav-item { justify-content: center; padding: 0; }
    body.sidebar-collapsed .tenant-card { justify-content: center; padding: 8px; }

    @media (max-width: 1300px) {
      .stats-grid[data-columns] { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .grid-2 { grid-template-columns: minmax(0,1fr) 330px; }
      .donut-row { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .cards { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .profile-copy { display: none; }
      .tenant-switcher { min-width: 165px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">

          <div class="brand-sub">Control plane</div>

        <button class="collapse-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
      </div>

        </div>
        <button class="topbar-search" id="searchOpen" aria-label="Open global search">

            <span class="avatar">AM</span>

    </div>
  </div>

  <div class="dropdown" id="tenantMenu"></div>
  <div class="dropdown" id="notificationsMenu"></div>
  <div class="dropdown" id="profileMenu"></div>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="drawer-title" id="drawerTitle">Details</div>
        <div class="panel-subtitle" id="drawerSubtitle"></div>
      </div>

      </div>
      <button class="close-btn" data-close="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </section>

  <section class="palette" id="palette" aria-label="Global search">
    <div class="palette-search"><span id="paletteSearchIcon"></span><input id="paletteInput" placeholder="Search the whole platform" autocomplete="off" /><kbd class="kbd">Esc</kbd></div>
    <div class="palette-results" id="paletteResults"></div>
  </section>

  <div class="toast-stack" id="toasts"></div>

  function esc(value) {

  function slug(value) { return String(value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

  function navigate(route) {
    if (!renderers[route]) route = 'dashboard';
    if (location.hash.slice(1) === route) {
      current.route = route;
      renderApp();
    } else {
      location.hash = route;
    }
    closeMenus();
  }

  function renderApp() {
    const hashRoute = location.hash.replace(/^#\/?/, '').split('/')[0];
    current.route = renderers[hashRoute] ? hashRoute : 'dashboard';
    const meta = routeMeta[current.route] || { title:'Dashboard', group:'Overview' };
    document.getElementById('breadcrumb').textContent = meta.group;
    document.getElementById('topPageTitle').textContent = meta.title;
    document.getElementById('app').innerHTML = renderers[current.route]();
    renderSidebar();
    document.title = `${meta.title} — Toeshee RMS Prototype`;
    window.scrollTo({top:0,behavior:'instant'});
    if (current.route === 'ai-admin') requestAnimationFrame(() => {
      const chat = document.getElementById('chatScroll');
      if (chat) chat.scrollTop = chat.scrollHeight;
    });
  }

  function toast(title, copy='') {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span class="toast-icon">${icon('check',14)}</span><span><div class="toast-title">${esc(title)}</div>${copy?`<div class="toast-copy">${esc(copy)}</div>`:''}</span>`;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(8px)'; }, 3600);
    setTimeout(() => el.remove(), 3950);
  }

  function setOverlay(open) {
    document.getElementById('overlay').classList.toggle('open', !!open);
  }

  function openDrawer(title, subtitle, body, footer='') {
    document.getElementById('drawerTitle').textContent = title;
    document.getElementById('drawerSubtitle').textContent = subtitle || '';
    document.getElementById('drawerBody').innerHTML = body;
    document.getElementById('drawerFoot').innerHTML = footer || `<button class="btn" data-close="drawer">Close</button>`;
    document.getElementById('drawer').classList.add('open');
    setOverlay(true);
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    if (!document.getElementById('modal').classList.contains('open') && !document.getElementById('palette').classList.contains('open')) setOverlay(false);
  }

  function openModal(title, subtitle, body, footer='', wide=false) {
    const modal = document.getElementById('modal');
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalSubtitle').textContent = subtitle || '';
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalFoot').innerHTML = footer || `<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-modal">Confirm</button>`;
    modal.style.width = wide ? 'min(1040px, 92vw)' : 'min(650px, 90vw)';
    modal.classList.add('open');
    setOverlay(true);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    if (!document.getElementById('drawer').classList.contains('open') && !document.getElementById('palette').classList.contains('open')) setOverlay(false);
  }

  function closeMenus() {
    document.querySelectorAll('.dropdown.open').forEach(m => m.classList.remove('open'));

  function openDetail(value) {
    const [kind, ...rest] = String(value).split(':');
    const id = rest.join(':');
    if (kind === 'device') {
      const d = devices.find(x=>x.id===id); if (d) return deviceDrawer(d);
    }
    if (kind === 'ticket') {
      const t = tickets.find(x=>x.id===id) || {id,title:'Service desk request',requester:'Portal user',queue:'Helpdesk',priority:'Medium',status:'Open',due:'4 hr',device:'Unassigned'}; return ticketDrawer(t);
    }
    if (kind === 'alert') {
      const a = alerts.find(x=>x.id===id); if (a) return alertDrawer(a);
    }
    if (kind === 'job') {
      const j = jobs.find(x=>x.id===id) || {id,type:'scheduled.job',target:'Endpoint group',signedBy:'Scheduler',status:'Completed',progress:100,started:'Yesterday'}; return jobDrawer(j);
    }
    return genericDrawer(kind,id);
  }

  function humanize(value) {
    return String(value).replace(/[-_.]+/g,' ').replace(/\b\w/g,m=>m.toUpperCase());

  }

  function enrollmentModal() {
    openModal('Create enrollment token','Generate a short-lived bootstrap credential bound to an organization and optional site/group.',`<div class="form-grid">${formField('Organization',`<select>${tenants.map((t,i)=>`<option ${i===current.tenant?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`,true)}${formField('Site','<select><option>Bogota HQ</option><option>Acme Branch</option><option>Northstar DC</option><option>Remote</option></select>')}${formField('Default group','<select><option>Workstations</option><option>Servers</option><option>Canary</option><option>Unassigned</option></select>')}${formField('Expires','<select><option>2 hours</option><option>24 hours</option><option>7 days</option></select>')}${formField('Maximum uses','<input type="number" value="25"/>')}${formField('Installer command preview','<div class="code">toeshee-agent enroll --server https://rms.toeshee.internal --token ENR-••••-••••</div>',true)}</div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-enrollment">Create token</button>`);
  }

  function ticketModal(target='') {
    openModal('Create service desk ticket','Attach requester, device context, queue, priority, and SLA policy.',`<div class="form-grid">${formField('Summary','<input placeholder="Describe the request or incident"/>',true)}${formField('Type','<select><option>Incident</option><option>Service request</option></select>')}${formField('Priority','<select><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select>')}${formField('Requester','<input placeholder="Name or email"/>')}${formField('Queue','<select><option>Helpdesk</option><option>Endpoint Ops</option><option>Infrastructure</option><option>Software</option></select>')}${formField('Affected device',`<input value="${esc(target)}" placeholder="Optional device"/>`)}${formField('Description','<textarea placeholder="Impact, symptoms, requested outcome, and relevant context"></textarea>',true)}${formField('Automation','<select><option>Attach device inventory and open alerts</option><option>No automatic context</option></select>',true)}</div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-ticket">Create ticket</button>`);
  }

  function remoteModal(target='') {
    const d=devices.find(x=>x.id===target);
    openModal('Start audited remote session',target?`${target} · ${d?d.os:'managed endpoint'}`:'Choose a target and session policy.',`<div class="notice gold">${icon('lock',17)}<div><strong>Credentials remain hidden.</strong><br/>The selected vault reference is decrypted only inside the broker path. Session start, stop, technician, target, and recording state are audited.</div></div><div class="form-grid" style="margin-top:14px">${formField('Target',`<select>${devices.filter(x=>x.online).map(x=>`<option ${x.id===target?'selected':''}>${esc(x.id)} · ${esc(x.os)}</option>`).join('')}</select>`,true)}${formField('Protocol','<select><option>RDP</option><option>VNC</option><option>SSH</option></select>')}${formField('Credential profile','<select><option>Domain support admin</option><option>Local workstation admin</option><option>Linux support key</option><option>macOS support account</option></select>')}${formField('Linked ticket / change','<input placeholder="Required by policy for privileged targets"/>')}${formField('Recording','<select><option>Required · enabled</option></select>')}${formField('Support reason','<textarea placeholder="Why is this session needed?"></textarea>',true)}</div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-remote">${icon('remote',14)}Start session</button>`);
  }

  function approvedActionModal() {
    openModal('Add approved AI action','The model will reference this catalog key; the organization defines the exact effect, risk, and safety fuses.',`<div class="form-grid">${formField('Catalog key','<input placeholder="example.safe.action"/>',true)}${formField('Job type','<select><option>deploy.script</option><option>backup.run</option><option>patch.install</option><option>agent.restart</option></select>')}${formField('Risk class','<select><option>Low</option><option>Medium</option><option>High</option></select>')}${formField('Allowed personas','<select><option>Admin only</option><option>Admin + technician</option><option>All authenticated personas</option></select>')}${formField('Approval ceiling','<select><option>Confirm every time</option><option>Guided</option><option>Suggest only</option></select>')}${formField('Daily rate fuse','<input type="number" value="20"/>')}${formField('Pinned parameters','<textarea>{\n  "script_id": "approved-script",\n  "timeout": 300\n}</textarea>',true,'Parameters are authored by an organization admin, not generated by the model.')}</div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-approved-action">Create catalog action</button>`);
  }

  function genericCreateModal(action, target='') {
    const title=humanize(action);
    openModal(title,'Interactive prototype workflow. The real operation would call the registered module API, enforce server-side authorization and tenant scope, then write audit context.',`<div class="form-grid">${formField('Name / summary',`<input value="${esc(target)}" placeholder="Enter a descriptive name"/>`,true)}${formField('Owner','<select><option>Alex Morgan</option><option>Priya Singh</option><option>Sam Patel</option><option>Unassigned</option></select>')}${formField('State','<select><option>Draft</option><option>Active</option><option>Scheduled</option></select>')}${formField('Organization',`<input value="${esc(tenants[current.tenant].name)}" disabled/>`,true)}${formField('Description','<textarea placeholder="Add the details required by this module workflow"></textarea>',true)}</div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="confirm-generic" data-confirm-label="${esc(title)}">Save</button>`);
  }

  function moduleDirectoryModal() {
    const body=navGroups.map(group=>`<div style="margin-bottom:18px"><div class="eyebrow">${esc(group.label)}</div><div class="cards">${group.items.map(item=>`<article class="module-card clickable" data-route="${item[0]}"><div class="card-icon">${icon(item[2],18)}</div><div class="card-title">${esc(item[1])}</div><div class="card-copy">Open the ${esc(item[1].toLowerCase())} screen in the interactive platform prototype.</div><div class="card-meta"><span class="status purple">Interactive</span><span class="panel-link">Open screen</span></div></article>`).join('')}</div></div>`).join('');
    openModal('Complete platform directory','Every documented business module, service-desk submodule, and operator-facing kernel surface is represented.',body,`<button class="btn primary" data-close="modal">Done</button>`,true);
  }

  function helpModal() {
    openModal('Prototype guide','How to explore this self-contained HTML platform design.',`<div class="grid grid-equal"><article class="asset-card"><div class="card-icon">${icon('dashboard',18)}</div><div class="card-title">30 routed screens</div><div class="card-copy">Use the grouped sidebar or Ctrl K to open every roadmap module and platform surface.</div></article><article class="asset-card"><div class="card-icon gold">${icon('devices',18)}</div><div class="card-title">Clickable records</div><div class="card-copy">Select device, ticket, alert, job, change, evidence, and registry rows to open detail drawers.</div></article><article class="asset-card"><div class="card-icon">${icon('play',18)}</div><div class="card-title">Interactive actions</div><div class="card-copy">Primary actions open realistic forms, previews, confirmations, or simulated outcomes.</div></article><article class="asset-card"><div class="card-icon gold">${icon('sparkles',18)}</div><div class="card-title">Working AI demo</div><div class="card-copy">Ask the AI admin about risk, patch, backup, FILE-SERVER, or disk remediation; switch to act mode for an approved proposal.</div></article></div><div class="notice" style="margin-top:14px">${icon('info',17)}<div><strong>Prototype data only.</strong><br/>The interface is a design artifact. It does not connect to the FastAPI control plane or dispatch real endpoint jobs.</div></div>`,`<button class="btn primary" data-close="modal">Explore platform</button>`);
  }

  function handleAction(action, element) {
    const target=element?.dataset?.target || '';
    if (!action) return;
    if (action==='run-job' || action==='health-check' || action==='patch-scan' || action==='run-backup') return runJobModal(target || (action==='health-check'?'Selected health policy':action==='patch-scan'?'All endpoints':action==='run-backup'?'Protected endpoints':''));
    if (action==='enroll-device' || action==='new-enrollment-token') return enrollmentModal();
    if (['new-ticket','create-device-ticket','create-alert-ticket'].includes(action)) return ticketModal(target);
    if (['remote-connect','remote-picker'].includes(action)) return remoteModal(target);
    if (action==='new-approved-action') return approvedActionModal();
    if (action==='module-directory') return moduleDirectoryModal();
    if (action==='open-help') return helpModal();
    if (action==='organization-manager') { closeMenus(); return navigate('settings'); }
    if (action==='sign-out-demo') return toast('Demo sign-out blocked','This standalone prototype has no live authentication session.');
    if (action==='confirm-job') { closeModal(); return toast('Signed job dispatched','The immutable envelope was queued and the audit event was written.'); }
    if (action==='confirm-enrollment') { closeModal(); return toast('Enrollment token created','A short-lived organization-scoped token is ready to copy.'); }
    if (action==='confirm-ticket') { closeModal(); return toast('Ticket created','Device context and the applicable SLA policy were attached.'); }
    if (action==='confirm-remote') { closeModal(); return toast('Remote session started','The broker opened an audited, recorded session using the selected vault reference.'); }
    if (action==='confirm-approved-action') { closeModal(); return toast('Approved action created','The catalog key, risk ceiling, pinned parameters, and rate fuse are active.'); }
    if (action==='confirm-generic') { const label=element.dataset.confirmLabel || 'Record'; closeModal(); return toast(`${label} saved`,'The prototype recorded the successful module workflow.'); }
    if (action==='confirm-modal') { closeModal(); return toast('Action confirmed','The interactive prototype completed the workflow.'); }
    if (action==='confirm-ai-proposal') {
      return openModal('Confirm approved AI action','Review the server-resolved effect. The model supplied only the catalog key.',`<div class="notice gold">${icon('warning',17)}<div><strong>Medium-risk action · explicit confirmation required</strong><br/>Confirming requires the permission of the underlying job route. AI confirmation is not a skeleton key.</div></div><div class="code" style="margin-top:14px">proposal_id: AIP-8831\ncatalog_key: disk.cleanup.workstation\ntarget: ${esc(target||'ACME-LAPTOP-07')}\nresolved_job_type: deploy.script\nscript_pin: sha256:5d31...c0a8\nrate_fuse: 50 / organization / day\ndigest: sha256:117a...92e1</div><div class="field" style="margin-top:14px"><label>Operational reason</label><textarea placeholder="Confirm why this remediation is appropriate">Resolve critical disk-space alert ALT-1042.</textarea></div>`,`<button class="btn" data-close="modal">Cancel</button><button class="btn primary" data-action="final-ai-confirm">Confirm & dispatch signed job</button>`);
    }
    if (action==='final-ai-confirm') {
      closeModal();
      current.aiMessages.push({role:'assistant',text:'Confirmed. I delegated proposal AIP-8831 to the shared AI action service. The resolved deploy.script job was signed, dispatched to ACME-LAPTOP-07, and linked to ALT-1042. I did not construct the script or its parameters.'});
      toast('AI action dispatched','Approved catalog key resolved to a signed, audited job.');
      if (current.route==='ai-admin') renderApp();
      return;
    }
    if (action==='decline-ai-proposal') {
      current.aiMessages.push({role:'assistant',text:'The proposal was declined. No job was created or dispatched; the decision was recorded in the AI audit trail.'});
      toast('Proposal declined','No endpoint action was dispatched.');
      if(current.route==='ai-admin') renderApp();
      return;
    }
    if (/^(export|download|copy)/.test(action) || ['export-dashboard','export-inventory','export-security-logs','export-change-calendar','export-bcp','export-audit','export-sla','export-odoo','download-diagnostics','download-agent','download-job-log','copy-job-id'].includes(action)) {
      return toast(`${humanize(action)} prepared`,'A tenant-scoped prototype export is ready. No real file was generated from this UI action.');
    }
    if (/^(save|test|run|retry|verify|ack|approve|resolve|end|rotate|scan|reconcile|reprocess)/.test(action) || ['ticket-resolve','ack-all','approve-patches','run-network-sweep','run-probes','verify-chain','verify-audit-range','reconcile-licenses'].includes(action)) {
      return toast(`${humanize(action)} completed`,'The mock workflow applied authorization, tenant scope, and audit context.');
    }
    if (action==='full-portal-preview') { navigate('portal'); return toast('Portal preview active','Use the portal tabs to explore requester flows and the constrained support assistant.'); }
    if (action==='new-ai-session') { current.aiMessages=[{role:'assistant',text:'New session started. I will use only allowlisted tools within your current organization and RBAC scope.'}]; renderApp(); return; }
    if (/^(new|create|add|import|upload|configure|edit|schedule|build|reserve|promote|invite|use|open|browse|start)/.test(action) || ['queue-settings','remote-policy','portal-settings','notification-settings','email-settings','site-docs','job-docs','enrollment-guide','settings-audit','ai-history','bulk-device-action','bulk-ticket','bulk-change','filter-devices','renewal-action','portal-action','portal-ai-send'].includes(action)) {
      return genericCreateModal(action,target);
    }
    return genericCreateModal(action,target);
  }

  function aiResponse(prompt) {
    const q=prompt.toLowerCase();
    const act=(current.tabs['ai-admin']||'read')==='act';
    if (q.includes('highest') || q.includes('risk')) return {text:'The highest-priority endpoints are ACME-LAPTOP-07 (high risk: 94% disk, 43% patch compliance, failed backup), DC-01 (high risk: repeated failed logins), and SRV-FS-01 (high risk: file-server role with 82% disk use). I would address the Acme laptop first because it has simultaneous capacity, patch, and continuity exposure.'};
    if (q.includes('patch') && q.includes('backup')) return {text:'Executive posture: fleet patch compliance is 84%, with 17 critical updates missing and 31 endpoints awaiting reboot. Backup success is 96%; one current failure is ACME-LAPTOP-07, while the latest Finance share restore test passed inside its RTO and RPO. The combined risk is concentrated in 18 endpoints rather than fleet-wide.'};
    if (q.includes('file-server') || q.includes('file server')) return {text:'FILE-SERVER last checked in 34 minutes ago on Windows Server 2019. Patch compliance is 79%, backup status is successful, and current risk is medium. In the last 24 hours it completed a backup verification, produced one warning that auto-cleared, and was linked to change CHG-2404 for the upcoming Finance share restore test.'};
    if (q.includes('disk') || q.includes('acme-laptop-07') || q.includes('remediation')) {
      if (act) return {text:'ALT-1042 is a deduplicated critical disk alert on ACME-LAPTOP-07. The approved catalog contains disk.cleanup.workstation, which resolves to a pinned deploy.script job with a medium-risk confirmation ceiling and a 50-per-day organization fuse. I can propose it without inventing any command or parameter.',proposal:{key:'disk.cleanup.workstation',target:'ACME-LAPTOP-07',job:'deploy.script',risk:'Medium'}};
      return {text:'ALT-1042 is the critical disk alert on ACME-LAPTOP-07. The endpoint is at 94% disk, 43% patch compliance, and its latest backup failed. A matching approved remediation exists, but this session is in read/analyze mode. Switch to “Propose actions” to preview the catalogued response; no action has been created.'};
    }
    if (q.includes('ticket') || q.includes('service')) return {text:'There are 23 open tickets: 7 due today and 3 overdue. The most time-sensitive is INC-1041, the automation-created disk cleanup incident, with 12 minutes remaining on its critical SLA. Helpdesk attainment is 93%; approval delay is the main contributor to current risk.'};
    if (q.includes('license') || q.includes('subscription') || q.includes('budget')) return {text:'Financial exposure: Adobe Acrobat Pro is overused by 3 seats and renews September 18; Zoom has 19 unused seats and a September 5 notice deadline; Microsoft Azure is running 4% above its monthly baseline. The budget remains near plan, but the SaaS optimization scenario identifies roughly $16,000 in annual savings.'};
    return {text:'Across your current tenant I see 286 endpoints, 12 active alerts, 23 open tickets, 84% patch compliance, and 96% backup success. Ask for a device, risk area, business workflow, or evidence domain and I will narrow the analysis using the allowlisted tools available to your role.'};
  }

  function sendAI(promptOverride='') {
    const input=document.getElementById('aiInput');
    const prompt=(promptOverride || input?.value || '').trim();
    if (!prompt) return;
    current.aiMessages.push({role:'user',text:prompt});
    const response=aiResponse(prompt);
    current.aiMessages.push({role:'assistant',text:response.text,proposal:response.proposal});
    renderApp();
  }

  const paletteItems = [
    ...navGroups.flatMap(group=>group.items.map(item=>({type:'module',label:item[1],sub:group.label,icon:item[2],route:item[0]}))),
    ...devices.map(d=>({type:'device',label:d.id,sub:`${d.os} · ${d.site} · ${d.user}`,icon:'devices',detail:`device:${d.id}`})),
    ...tickets.map(t=>({type:'ticket',label:`${t.id} · ${t.title}`,sub:`${t.requester} · ${t.status}`,icon:'ticket',detail:`ticket:${t.id}`})),
    ...alerts.map(a=>({type:'alert',label:`${a.id} · ${a.title}`,sub:`${a.device} · ${a.severity}`,icon:'warning',detail:`alert:${a.id}`})),
    ...docs.map(d=>({type:'document',label:d.title,sub:`${d.id} · ${d.type} · ${d.owner}`,icon:'book',detail:`doc:${d.id}`}))
  ];

  function renderPalette(query='') {
    const q=query.trim().toLowerCase();
    const results=paletteItems.filter(item=>!q || `${item.label} ${item.sub} ${item.type}`.toLowerCase().includes(q)).slice(0,18);
    document.getElementById('paletteResults').innerHTML = results.length ? results.map((item,i)=>`<button class="palette-item ${i===0?'active':''}" ${item.route?`data-palette-route="${item.route}"`:`data-palette-detail="${item.detail}"`}><span class="mini-icon ${item.type==='alert'?'gold':''}">${icon(item.icon,14)}</span><span><strong style="display:block;font-size:10px">${esc(item.label)}</strong><span style="display:block;color:var(--muted);font-size:9px;margin-top:2px">${esc(item.sub)}</span></span><span class="meta">${esc(item.type)}</span></button>`).join('') : `<div class="empty"><div><div class="empty-icon">${icon('search',22)}</div><h3>No results</h3><p>Try a module, device, ticket, alert, or document name.</p></div></div>`;
  }

  function openPalette() {
    closeMenus();
    const palette=document.getElementById('palette');
    palette.classList.add('open');
    setOverlay(true);
    const input=document.getElementById('paletteInput');
    input.value='';
    renderPalette('');
    setTimeout(()=>input.focus(),20);
  }

  function closePalette() {
    document.getElementById('palette').classList.remove('open');
    if (!document.getElementById('drawer').classList.contains('open') && !document.getElementById('modal').classList.contains('open')) setOverlay(false);
  }

  function setTenant(index, notify=true) {
    current.tenant=Number(index)||0;
    const t=tenants[current.tenant];
    document.getElementById('sideTenantName').textContent=t.name;
    document.getElementById('topTenantName').textContent=t.name;
    document.getElementById('sideTenantAvatar').textContent=t.initials;
    closeMenus();
    renderApp();
    if (notify) toast('Organization switched',`The console is now scoped to ${t.name}.`);
  }

  document.addEventListener('click', event => {
    const menuTrigger=event.target.closest('[data-menu]');
    if (menuTrigger) {
      event.preventDefault(); event.stopPropagation();
      const name=menuTrigger.dataset.menu;
      const menu=document.getElementById(`${name}Menu`);
      if (menu?.classList.contains('open')) closeMenus(); else openMenu(name,menuTrigger);
      return;
    }

    const routeEl=event.target.closest('[data-route]');
    if (routeEl) {
      event.preventDefault();
      closeModal();
      closeDrawer();
      navigate(routeEl.dataset.route);
      return;
    }

    const paletteRoute=event.target.closest('[data-palette-route]');
    if (paletteRoute) {
      closePalette(); navigate(paletteRoute.dataset.paletteRoute); return;
    }
    const paletteDetail=event.target.closest('[data-palette-detail]');
    if (paletteDetail) {
      closePalette(); openDetail(paletteDetail.dataset.paletteDetail); return;
    }

    const tenantEl=event.target.closest('[data-tenant-index]');
    if (tenantEl) { setTenant(tenantEl.dataset.tenantIndex); return; }

    const tabEl=event.target.closest('[data-tab][data-tab-route]');
    if (tabEl) {
      current.tabs[tabEl.dataset.tabRoute]=tabEl.dataset.tab;
      renderApp();
      return;
    }

    const promptEl=event.target.closest('[data-ai-prompt]');
    if (promptEl) { sendAI(promptEl.dataset.aiPrompt); return; }

    const actionEl=event.target.closest('[data-action]');
    if (actionEl) {
      event.preventDefault(); event.stopPropagation();
      handleAction(actionEl.dataset.action,actionEl);
      return;
    }

    const detailEl=event.target.closest('[data-detail]');
    if (detailEl) {
      event.preventDefault();
      openDetail(detailEl.dataset.detail);
      return;
    }

    const closeEl=event.target.closest('[data-close]');
    if (closeEl) {
      if (closeEl.dataset.close==='drawer') closeDrawer();
      if (closeEl.dataset.close==='modal') closeModal();
      return;
    }

    if (!event.target.closest('.dropdown')) closeMenus();
  });

  document.addEventListener('input', event => {
    if (event.target.id==='paletteInput') renderPalette(event.target.value);
    if (event.target.id==='deviceSearch') {
      const q=event.target.value.trim().toLowerCase();
      document.querySelectorAll('#app tbody tr').forEach(row=>row.style.display=!q || row.textContent.toLowerCase().includes(q)?'':'none');
    }
  });

  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase()==='k') {
      event.preventDefault(); openPalette();
    }
    if (event.key==='Escape') {
      closeMenus(); closePalette(); closeDrawer(); closeModal();
    }
    if (event.key==='Enter' && event.target.id==='paletteInput') {
      const active=document.querySelector('.palette-item.active') || document.querySelector('.palette-item');
      if (active) active.click();
    }
    if (event.key==='Enter' && event.target.id==='aiInput' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault(); sendAI();
    }
  });

  document.getElementById('searchOpen').addEventListener('click', openPalette);
  document.getElementById('overlay').addEventListener('click', closeAllLayers);
  document.getElementById('collapseBtn').addEventListener('click', () => {
    current.sidebarCollapsed=!current.sidebarCollapsed;
    document.body.classList.toggle('sidebar-collapsed',current.sidebarCollapsed);
    document.getElementById('collapseBtn').innerHTML=icon(current.sidebarCollapsed?'chevronRight':'chevronLeft',16);
  });

  document.addEventListener('click', event => {
    if (event.target.closest('#aiSend')) sendAI();
  });

  window.addEventListener('hashchange', renderApp);
  window.addEventListener('resize', closeMenus);

  const initialTenant = tenants[0];
  document.getElementById('sideTenantName').textContent = initialTenant.name;
  document.getElementById('topTenantName').textContent = initialTenant.name;
  document.getElementById('sideTenantAvatar').textContent = initialTenant.initials;
  if (!location.hash) location.hash='dashboard';
  else renderApp();
  </script>
</body>
</html>
