# The acceptor only decrypts tickets with its keytab (KRB5_KTNAME); it never
# talks to the KDC. This names the realm so MIT resolves the principal.
[libdefaults]
    default_realm = CORP.EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false

[domain_realm]
    .corp.example.com = CORP.EXAMPLE.COM
    corp.example.com = CORP.EXAMPLE.COM
