# ITMS login theme.
#
# parent=base, NOT keycloak. `base` supplies the templates and the message
# bundles and no styling at all, which is what a from-scratch brand wants;
# extending `keycloak` would inherit its whole stylesheet and leave this theme
# overriding rules it does not own.
#
# `import=common/keycloak` is still needed: it is where the shared resources
# (the base reset, the message bundles' English defaults) live, and dropping it
# produces a page with unresolved ${msg(...)} placeholders.
parent=base
import=common/keycloak

styles=css/itms.css

# Applied to <html> and to the card by the base template. The stylesheet keys
# off these rather than off Keycloak's own class names, which change between
# releases.
kcHtmlClass=itms
kcLoginClass=itms-login
